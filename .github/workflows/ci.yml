name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://x:x@localhost:5432/x
      DATABASE_URL_UNPOOLED: postgresql://x:x@localhost:5432/x
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_dummy
      INITIAL_GM_EMAILS: gm@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm run test:coverage
      - run: npm run build

  # Database tests on a throwaway Postgres 18 container that lives only for this job (D-92). Nothing touches Neon:
  # test runs against Neon branches were ~98% of the project's data transfer and used up the free 5 GB quota.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isfc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d isfc"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/isfc
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/isfc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: 'Apply migrations (twice - the second run must be a no-op)'
        run: |
          npm run db:migrate
          npm run db:migrate | tee /tmp/second.txt
          grep -q "database is up to date" /tmp/second.txt

      # Most DB tests need the seeded data (cost_settings row, brands, ingredients). Seed before the tests: vitest runs
      # test files in parallel, so relying on seed.test.ts to do it races.
      - name: Seed
        env:
          NEON_BRANCH: ci-local
        run: npm run db:seed -- --confirm

      - name: Database tests
        run: npm run test:db
